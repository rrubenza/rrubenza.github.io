<title>{% if page.title_override %}{{ page.title_override }}{% elsif page.title %}{{ page.title }} - Ryan Rubenzahl{% else %}Ryan Rubenzahl{% endif %}</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Search results and link previews -->
{% assign page_title = page.title_override | default: page.title | default: site.title %}
{% assign page_desc = page.description | default: page.blurb | default: site.description %}
<meta name="description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 }}" />
<meta name="author" content="{{ site.title }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:title" content="{{ page_title }}" />
<meta property="og:description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ site.og_image | absolute_url }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page_title }}" />
<meta name="twitter:description" content="{{ page_desc | strip_html | strip_newlines | truncate: 200 }}" />
<meta name="twitter:image" content="{{ site.og_image | absolute_url }}" />
<link rel="stylesheet" href="{{ '/assets/sass/main.css' | relative_url }}" />
